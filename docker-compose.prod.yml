services:
  # -------------------------------------------------------------
  # 1. Reverse Proxy & Frontend SPA
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lms_ai_prod_frontend
    restart: always
    ports:
      - "${PROD_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - lms_prod_network

  # -------------------------------------------------------------
  # 2. Core LMS REST API (Node.js + Express)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms_ai_prod_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-lms_admin}
      DB_PASSWORD: ${DB_PASSWORD:-lms_dev_password}
      DB_NAME: ${DB_NAME:-lms_ai_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-key-change-in-production-lms-ai-2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-jwt-secret-key-change-in-production-lms-ai-2026}
      UPLOAD_DIR: /app/uploads
    volumes:
      - lms_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - lms_prod_network

  # -------------------------------------------------------------
  # 3. AI Service & RAG Engine (FastAPI + pgvector)
  # -------------------------------------------------------------
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: lms_ai_prod_service
    restart: always
    environment:
      AI_SERVICE_HOST: 0.0.0.0
      AI_SERVICE_PORT: 8000
      WEB_CONCURRENCY: 4
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-lms_admin}
      DB_PASSWORD: ${DB_PASSWORD:-lms_dev_password}
      DB_NAME: ${DB_NAME:-lms_ai_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lms_prod_network

  # -------------------------------------------------------------
  # 4. PostgreSQL Database with pgvector extension
  # -------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lms_ai_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-lms_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lms_dev_password}
      POSTGRES_DB: ${DB_NAME:-lms_ai_db}
    volumes:
      - lms_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lms_admin} -d ${DB_NAME:-lms_ai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lms_prod_network

  # -------------------------------------------------------------
  # 5. Redis Cache & Job Queue
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: lms_ai_prod_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - lms_redisdata_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - lms_prod_network

volumes:
  lms_pgdata_prod:
  lms_redisdata_prod:
  lms_uploads:

networks:
  lms_prod_network:
    driver: bridge

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lms_ai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-lms_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lms_dev_password}
      POSTGRES_DB: ${DB_NAME:-lms_ai_db}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - lms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-lms_admin} -d ${DB_NAME:-lms_ai_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lms_ai_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - lms_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  lms_pgdata:
  lms_redisdata:
